name: achiote
version: "0.1.0"
manifest_version: 2
description: "Achiote for Hermes: turn a half-remembered family dish into a researched, cited minimum-viable nostalgia cue and local-ingredient recipe. Adds pre_llm_call fragment detection, cite-or-die guardrails, /achiote, reconstruct tools, saved-dish memory under plugin-data, and a Desktop nostalgia pane with a provenance graph. Disclosure — shells out to `npx -y achiote@0.2.2 ask` (downloads from npm on first run; needs Node >=22); optional model API keys (e.g. ANTHROPIC_API_KEY) are read through Hermes secret scope and passed only for reconstruct; research cache and saved dishes live under <HERMES_HOME>/plugin-data/achiote/; child env is scrubbed (no full os.environ). Heritage-locale / DialectOS is NOT bundled. Photo→memory and /achiote cook are Monday stretch stubs only."
author: "Kyanite Labs"
license: BUSL-1.1
homepage: https://github.com/KyaniteLabs/Achiote/tree/master/plugins/achiote-hermes
tags: [food-memory, nostalgia, provenance, citations, recipes, desktop]
requires_hermes: ">=0.21.6"
requires_env: []
provides_tools:
  - achiote_reconstruct
  - achiote_save_dish
  - achiote_list_dishes
  - achiote_cite_check
provides_hooks:
  - pre_llm_call
  - pre_tool_call
hooks:
  - pre_llm_call
  - pre_tool_call
config_schema:
  achiote_command:
    type: str
    default: "npx -y achiote@0.2.2"
    description: "Command prefix for the Achiote CLI (e.g. 'achiote' if installed globally)."
  inject_on_fragment:
    type: bool
    default: true
    description: "When true, pre_llm_call injects a research brief if the user message looks like a half-remembered dish."
  cite_or_die:
    type: bool
    default: true
    description: "Inject cite-or-die guardrails and block tool calls that claim a nostalgia cue without citation/local-sub evidence when detectable."
  timeout_seconds:
    type: int
    default: 180
  enable_cook_slash:
    type: bool
    default: false
    description: "Monday stretch only. When false, /achiote cook returns not-enabled."
