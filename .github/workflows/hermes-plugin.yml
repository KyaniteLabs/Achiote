name: Achiote Hermes plugin
on:
  push:
    paths: ['hermes-plugin/**', '.github/workflows/hermes-plugin.yml']
  pull_request:
    paths: ['hermes-plugin/**', '.github/workflows/hermes-plugin.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: e76fbd80be65ea5c1b89831f8d7aaedb713f5cac
          path: .hermes-runtime
      - name: Install pinned runtime using its upstream lock and overrides
        # pip ignores upstream's sanctioned Pillow 13 override for browser-harness.
        # Keep runtime source and uv.lock unchanged; see CI-BOOTSTRAP.md.
        run: |
          python -m pip install uv==0.11.22
          uv sync --project .hermes-runtime --locked --no-dev
          git -C .hermes-runtime diff --exit-code
      - run: .hermes-runtime/.venv/bin/python -m unittest discover -s hermes-plugin/tests -v
      - run: node --check hermes-plugin/desktop/plugin.js
      - run: |
          mkdir -p receipts
          .hermes-runtime/.venv/bin/hermes plugins validate ./hermes-plugin --json > receipts/validate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: achiote-plugin-validation
          path: receipts/
