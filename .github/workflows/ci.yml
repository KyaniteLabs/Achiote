name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-gate:
    name: Node 22 release gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Validate citations
        run: npm run validate:citations

      - name: Audit production dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Smoke packaged CLI
        run: npm run package:smoke

      - name: Verify package contents
        run: npm pack --dry-run

  compatibility-gate:
    name: Node 24 compatibility gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check runtime compatibility
        run: npm run check:compat
