name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} quality gate
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Audit production dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Smoke packaged CLI
        run: npm run package:smoke

      - name: Verify package contents
        run: npm pack --dry-run
