<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Berries — Food Memory Detective</title>
  <meta name="description" content="Describe a half-remembered dish and we'll help you reconstruct it." />
  <style>
    :root {
      --cream: #fff7e8;
      --cream-2: #f8ead0;
      --plum: #4a1635;
      --plum-2: #6c2450;
      --plum-light: rgba(74, 22, 53, 0.06);
      --plum-lighter: rgba(74, 22, 53, 0.03);
      --card-solid: #fffdfc;
      --line: rgba(74, 22, 53, 0.14);
      --line-light: rgba(74, 22, 53, 0.08);
      --radius-md: 24px;
      --radius-full: 999px;
      --shadow: 0 2px 16px rgba(74, 22, 53, 0.06);
      --transition-base: 0.25s ease;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cream: #161014;
        --cream-2: #1f161c;
        --plum: #c47aa8;
        --plum-2: #d492b8;
        --plum-light: rgba(196, 122, 168, 0.08);
        --plum-lighter: rgba(196, 122, 168, 0.04);
        --card-solid: #1e181e;
        --line: rgba(242, 184, 75, 0.12);
        --line-light: rgba(242, 184, 75, 0.06);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--cream);
      color: var(--plum);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-solid);
      flex-shrink: 0;
    }
    header .logo {
      width: 32px; height: 32px; border-radius: 50%;
      background: conic-gradient(from 210deg, var(--plum), #8b4513, #f2b84b, #2d6a4f, var(--plum));
    }
    header h1 {
      font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em;
    }
    header h1 span { font-weight: 400; opacity: 0.5; }
    header nav { margin-left: auto; }
    header nav a {
      font-size: 0.85rem; color: var(--plum); opacity: 0.5;
      text-decoration: none; font-weight: 600;
    }
    header nav a:hover { opacity: 1; }

    /* Chat area */
    main {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Welcome state */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 20px; padding: 40px 20px;
    }
    .welcome.hide { display: none; }
    .welcome h2 {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;
      max-width: 400px; line-height: 1.3;
    }
    .welcome p {
      color: var(--plum); opacity: 0.55; max-width: 420px;
      font-size: 0.95rem; line-height: 1.6;
    }
    .welcome .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; max-width: 500px;
    }
    .suggestion {
      padding: 10px 16px; border-radius: var(--radius-full);
      border: 1px solid var(--line); background: var(--card-solid);
      font-size: 0.85rem; color: var(--plum); cursor: pointer;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      font-family: inherit;
    }
    .suggestion:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    /* Messages */
    .messages { display: none; flex-direction: column; gap: 16px; }
    .messages.active { display: flex; }

    .msg {
      max-width: 680px; width: 100%; margin: 0 auto;
      padding: 16px 20px; border-radius: var(--radius-md);
      line-height: 1.65; font-size: 0.95rem;
    }
    .msg.user {
      background: var(--plum-light);
      border: 1px solid var(--line-light);
      margin-left: auto;
    }
    .msg.ai {
      background: var(--card-solid);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .msg.ai strong { color: var(--plum); }
    .msg.ai ul, .msg.ai ol { margin: 8px 0; padding-left: 20px; }
    .msg.ai li { margin: 4px 0; }

    .typing {
      display: inline-flex; gap: 4px; padding: 4px 0;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--plum); opacity: 0.3;
      animation: blink 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.6; }
    }

    /* Input bar */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: var(--card-solid);
      flex-shrink: 0;
    }
    .input-wrap {
      max-width: 720px; margin: 0 auto;
      display: flex; gap: 10px; align-items: center;
    }
    .input-wrap input {
      flex: 1; padding: 14px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--cream);
      font-size: 0.95rem; font-family: inherit;
      color: var(--plum);
      outline: none;
      transition: border-color var(--transition-base);
    }
    .input-wrap input::placeholder { color: var(--plum); opacity: 0.35; }
    .input-wrap input:focus { border-color: var(--plum); }
    .input-wrap button {
      width: 46px; height: 46px; border-radius: 50%;
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--plum), var(--plum-2));
      color: #fff; font-size: 1.2rem;
      display: grid; place-items: center;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      flex-shrink: 0;
    }
    .input-wrap button:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(74, 22, 53, 0.3); }
    .input-wrap button:disabled { opacity: 0.4; transform: none; box-shadow: none; cursor: default; }

    /* Responsive */
    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      main { padding: 16px; }
      .input-bar { padding: 12px 16px; }
      .msg { padding: 14px 16px; }
      .welcome h2 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" role="img" aria-label="Member Berries logo"></div>
    <h1>Member Berries <span>/ food memory detective</span></h1>
    <nav><a href="/about">About</a></nav>
  </header>

  <main>
    <div class="welcome" id="welcome">
      <h2>What's the dish you can almost remember?</h2>
      <p>Describe a smell, a texture, a nickname, or the person who made it. Spelling doesn't matter — half memories are enough.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="send(this.textContent)">My abuela made pasteles with green bananas</button>
        <button class="suggestion" onclick="send(this.textContent)">Sour soup with dill and pale white chunks</button>
        <button class="suggestion" onclick="send(this.textContent)">Sticky rice wrapped in a leaf, tasted like coconut</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </main>

  <div class="input-bar">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Describe a food memory..." maxlength="600" autofocus />
      <button id="send-btn" onclick="send()" aria-label="Send">&#8593;</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const btn = document.getElementById('send-btn');
    const welcome = document.getElementById('welcome');
    const messages = document.getElementById('messages');
    let busy = false;

    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !busy) send(); });

    function send(text) {
      const val = (text || input.value).trim();
      if (!val || busy) return;
      input.value = '';

      welcome.classList.add('hide');
      messages.classList.add('active');

      addMsg('user', val);
      const aiEl = addMsg('ai', '<div class="typing"><span></span><span></span><span></span></div>');

      busy = true;
      btn.disabled = true;

      fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: val }),
      })
      .then(res => {
        if (!res.ok) throw new Error(`Server ${res.status}`);
        return streamResponse(res, aiEl);
      })
      .catch(err => {
        aiEl.innerHTML = err.message.includes('fetch')
          ? '<p>Server not running. Start it with <code>npm run demo</code>.</p>'
          : `<p>Error: ${err.message}</p>`;
      })
      .finally(() => { busy = false; btn.disabled = false; input.focus(); });
    }

    function addMsg(role, html) {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.innerHTML = html;
      messages.appendChild(el);
      el.closest('main').scrollTop = 1e6;
      return el;
    }

    async function streamResponse(res, el) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let text = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        for (const line of buffer.split('\n')) {
          if (line.startsWith('data: ')) {
            try {
              const d = JSON.parse(line.slice(6));
              if (typeof d === 'string') text += d;
            } catch { /* skip */ }
          }
        }
        if (text) el.innerHTML = formatMd(text);
        el.closest('main').scrollTop = 1e6;
      }
      if (!text) el.innerHTML = 'No response. Try rephrasing.';
    }

    function formatMd(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n- /g, '\n&#8226; ')
        .replace(/\n(\d+)\. /g, '\n$1. ')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
