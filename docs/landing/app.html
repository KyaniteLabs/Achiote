<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achiote — Food Memory Detective</title>
  <meta name="description" content="Describe a half-remembered dish and we'll help you reconstruct it." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
  <style>
    :root {
      --cream: #fff8f0;
      --cream-2: #f8e8d4;
      --achiote: #b5451b;
      --achiote-2: #d4653a;
      --achiote-light: rgba(181, 69, 27, 0.06);
      --achiote-lighter: rgba(181, 69, 27, 0.03);
      --card-solid: #fffdfc;
      --line: rgba(181, 69, 27, 0.14);
      --line-light: rgba(181, 69, 27, 0.08);
      --radius-md: 24px;
      --radius-full: 999px;
      --shadow: 0 2px 16px rgba(181, 69, 27, 0.06);
      --transition-base: 0.25s ease;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --cream: #18120e;
      --cream-2: #221a14;
      --achiote: #e07845;
      --achiote-2: #f09060;
      --achiote-light: rgba(224, 120, 69, 0.08);
      --achiote-lighter: rgba(224, 120, 69, 0.04);
      --card-solid: #1e1610;
      --line: rgba(242, 184, 75, 0.12);
      --line-light: rgba(242, 184, 75, 0.06);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--cream);
      color: var(--achiote);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-solid);
      flex-shrink: 0;
    }
    header .logo {
      width: 32px; height: 32px; border-radius: 50%;
      background: conic-gradient(from 210deg, var(--achiote), #8b4513, #f2b84b, #2d6a4f, var(--achiote));
    }
    header h1 {
      font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em;
    }
    header h1 span { font-weight: 400; opacity: 0.5; }
    header nav { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    header nav a {
      font-size: 0.85rem; color: var(--achiote); opacity: 0.5;
      text-decoration: none; font-weight: 600;
    }
    header nav a:hover { opacity: 1; }
    .theme-btn {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--card-solid);
      cursor: pointer; display: grid; place-items: center;
      color: var(--achiote); font-size: 0.9rem; padding: 0;
      transition: transform var(--transition-base);
    }
    .theme-btn:hover { transform: scale(1.08); }
    .theme-btn .sun { display: none; }
    .theme-btn .moon { display: block; }
    [data-theme="dark"] .theme-btn .sun { display: block; }
    [data-theme="dark"] .theme-btn .moon { display: none; }

    /* Chat area */
    main {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Welcome state */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 20px; padding: 40px 20px;
    }
    .welcome.hide { display: none; }
    .welcome h2 {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;
      max-width: 400px; line-height: 1.3;
    }
    .welcome p {
      color: var(--achiote); opacity: 0.55; max-width: 420px;
      font-size: 0.95rem; line-height: 1.6;
    }
    .welcome .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; max-width: 500px;
    }
    .suggestion {
      padding: 10px 16px; border-radius: var(--radius-full);
      border: 1px solid var(--line); background: var(--card-solid);
      font-size: 0.85rem; color: var(--achiote); cursor: pointer;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      font-family: inherit;
    }
    .suggestion:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    /* Messages */
    .messages { display: none; flex-direction: column; gap: 16px; }
    .messages.active { display: flex; }

    .msg {
      max-width: 680px; width: 100%; margin: 0 auto;
      padding: 16px 20px; border-radius: var(--radius-md);
      line-height: 1.65; font-size: 0.95rem;
    }
    .msg.user {
      background: var(--achiote-light);
      border: 1px solid var(--line-light);
      margin-left: auto;
    }
    .msg.ai {
      background: var(--card-solid);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .msg.ai strong { color: var(--achiote); }
    .msg.ai ul, .msg.ai ol { margin: 8px 0; padding-left: 20px; }
    .msg.ai li { margin: 4px 0; }

    .typing {
      display: inline-flex; gap: 4px; padding: 4px 0;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--achiote); opacity: 0.3;
      animation: blink 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.6; }
    }

    /* Input bar */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: var(--card-solid);
      flex-shrink: 0;
    }
    .input-wrap {
      max-width: 720px; margin: 0 auto;
      display: flex; gap: 10px; align-items: center;
    }
    .input-wrap input {
      flex: 1; padding: 14px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--cream);
      font-size: 0.95rem; font-family: inherit;
      color: var(--achiote);
      outline: none;
      transition: border-color var(--transition-base);
    }
    .input-wrap input::placeholder { color: var(--achiote); opacity: 0.35; }
    .input-wrap input:focus { border-color: var(--achiote); }
    .input-wrap button {
      width: 46px; height: 46px; border-radius: 50%;
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--achiote), var(--achiote-2));
      color: #fff; font-size: 1.2rem;
      display: grid; place-items: center;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      flex-shrink: 0;
    }
    .input-wrap button:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(74, 22, 53, 0.3); }
    .input-wrap button:disabled { opacity: 0.4; transform: none; box-shadow: none; cursor: default; }

    /* Responsive */
    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      main { padding: 16px; }
      .input-bar { padding: 12px 16px; }
      .msg { padding: 14px 16px; }
      .welcome h2 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" role="img" aria-label="Achiote logo"></div>
    <h1>Achiote <span>/ food memory detective</span></h1>
    <nav>
      <button class="theme-btn" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="moon">&#9789;</span>
        <span class="sun">&#9788;</span>
      </button>
      <a href="/about">About</a>
    </nav>
  </header>

  <main>
    <div class="welcome" id="welcome">
      <h2>What's the dish you can almost remember?</h2>
      <p>Describe a smell, a texture, a nickname, or the person who made it. Spelling doesn't matter — half memories are enough.</p>
      <div class="suggestions">
        <button class="suggestion" data-suggestion="My abuela made pasteles with green bananas">My abuela made pasteles with green bananas</button>
        <button class="suggestion" data-suggestion="Sour soup with dill and pale white chunks">Sour soup with dill and pale white chunks</button>
        <button class="suggestion" data-suggestion="Sticky rice wrapped in a leaf, tasted like coconut">Sticky rice wrapped in a leaf, tasted like coconut</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </main>

  <div class="input-bar">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Describe a food memory..." maxlength="600" autofocus />
      <button id="send-btn" aria-label="Send">&#8593;</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
