<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achiote — Food Memory Detective</title>
  <meta name="description" content="Describe a half-remembered dish and we'll help you reconstruct it." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
  <style>
    :root {
      --cream: #fff8f0;
      --cream-2: #f8e8d4;
      --ink: #2a1a0e;
      --muted: #6b5744;
      --achiote: #b5451b;
      --achiote-2: #d4653a;
      --achiote-deep: #8b3210;
      --terracotta: #c4694a;
      --sofrito: #2d6a4f;
      --mint: #cfe8d8;
      --saffron: #f2b84b;
      --card: rgba(255, 252, 245, 0.85);
      --card-solid: #fffdfc;
      --line: rgba(181, 69, 27, 0.14);
      --line-light: rgba(181, 69, 27, 0.08);
      --shadow: 0 24px 80px rgba(181, 69, 27, 0.12);
      --shadow-sm: 0 4px 16px rgba(181, 69, 27, 0.06);
      --shadow-hover: 0 32px 96px rgba(181, 69, 27, 0.20);
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 32px;
      --radius-full: 999px;
      --transition-fast: 0.15s ease;
      --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color-scheme: light;
    }

    [data-theme="dark"] {
      --cream: #18120e;
      --cream-2: #221a14;
      --ink: #f5e6d3;
      --muted: #b8a898;
      --achiote: #e07845;
      --achiote-2: #f09060;
      --achiote-deep: #c45e2e;
      --terracotta: #d8926e;
      --sofrito: #6ec49a;
      --mint: #2a4d3a;
      --saffron: #f2b84b;
      --card: rgba(30, 22, 16, 0.82);
      --card-solid: #1e1610;
      --line: rgba(242, 184, 75, 0.12);
      --line-light: rgba(242, 184, 75, 0.06);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 32px 96px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
    }

    /* Ambient background — matches landing page */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 8%, rgba(242, 184, 75, 0.18), transparent 32rem),
        radial-gradient(circle at 88% 4%, rgba(207, 232, 216, 0.35), transparent 28rem),
        radial-gradient(circle at 78% 82%, rgba(155, 74, 27, 0.08), transparent 30rem),
        linear-gradient(135deg, var(--cream) 0%, #fffdf8 46%, var(--cream-2) 100%);
      transition: background var(--transition-base);
    }

    [data-theme="dark"] body::before {
      background:
        radial-gradient(circle at 12% 8%, rgba(242, 184, 75, 0.08), transparent 32rem),
        radial-gradient(circle at 88% 4%, rgba(45, 106, 79, 0.14), transparent 28rem),
        radial-gradient(circle at 78% 82%, rgba(155, 74, 27, 0.06), transparent 30rem),
        linear-gradient(135deg, var(--cream) 0%, #1a1216 46%, var(--cream-2) 100%);
    }

    /* Header — matches landing page sticky + blur style */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 24px;
      backdrop-filter: blur(20px) saturate(1.4);
      background: rgba(255, 247, 232, 0.72);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      transition: background var(--transition-base), border-color var(--transition-base);
    }

    [data-theme="dark"] header {
      background: rgba(22, 16, 20, 0.72);
    }

    header .logo {
      width: 36px; height: 36px; border-radius: 12px;
      background: conic-gradient(from 210deg, var(--achiote), var(--terracotta), var(--saffron), var(--sofrito), var(--achiote));
      box-shadow: 0 8px 24px rgba(74, 22, 53, 0.22);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    header .logo::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 6px;
      background: var(--cream);
      opacity: 0.15;
    }

    header h1 {
      font-size: 1.05rem; font-weight: 800; letter-spacing: -0.03em;
      color: var(--ink);
    }
    header h1 span { font-weight: 500; color: var(--muted); }
    header nav { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    header nav a {
      font-size: 0.9rem; color: var(--muted);
      text-decoration: none; font-weight: 600;
      position: relative; padding: 4px 0;
      transition: color var(--transition-fast);
    }
    header nav a::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 2px;
      background: var(--saffron);
      border-radius: 2px;
      transition: width var(--transition-base);
    }
    header nav a:hover { color: var(--achiote); }
    header nav a:hover::after { width: 100%; }

    .theme-btn {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--card-solid);
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      font-size: 0.9rem;
      padding: 0;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      flex-shrink: 0;
    }
    .theme-btn:hover { transform: scale(1.08); box-shadow: var(--shadow-sm); }
    .theme-btn .sun { display: none; }
    .theme-btn .moon { display: block; }
    [data-theme="dark"] .theme-btn .sun { display: block; }
    [data-theme="dark"] .theme-btn .moon { display: none; }

    /* Trace panel */
    .trace-panel {
      margin-top: 8px; padding: 10px 12px;
      background: var(--card-solid);
      border-radius: var(--radius-sm);
      font-size: 12px; color: var(--muted);
      border: 1px solid var(--line);
      max-height: 220px; overflow-y: auto;
    }

    /* Chat area */
    main {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Welcome state */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 20px; padding: 40px 20px;
    }
    .welcome.hide { display: none; }
    .welcome h2 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 800; letter-spacing: -0.04em;
      max-width: 480px; line-height: 1.15;
      color: var(--ink);
    }
    .welcome p {
      color: var(--muted); max-width: 480px;
      font-size: 0.95rem; line-height: 1.6;
    }
    .welcome .suggestions {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; max-width: 560px;
    }
    .suggestion {
      padding: 10px 18px; border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--card-solid);
      font-size: 0.88rem; color: var(--muted); cursor: pointer;
      transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
      font-family: inherit; font-weight: 500;
    }
    .suggestion:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: var(--saffron);
      color: var(--achiote);
    }
    .suggestion:active {
      transform: scale(0.97);
      box-shadow: none;
    }

    /* Messages */
    .messages { display: none; flex-direction: column; gap: 16px; }
    .messages.active { display: flex; }

    .msg {
      max-width: 720px; width: 100%; margin: 0 auto;
      padding: 18px 22px; border-radius: var(--radius-lg);
      line-height: 1.65; font-size: 0.95rem;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    .msg:hover { transform: translateY(-2px); }
    .msg.user {
      background: var(--card-solid);
      border: 1px solid var(--line);
      margin-left: auto;
      box-shadow: var(--shadow-sm);
    }
    .msg.ai {
      background: var(--card-solid);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .msg.ai strong { color: var(--achiote); }
    .msg.ai ul, .msg.ai ol { margin: 8px 0; padding-left: 20px; }
    .msg.ai li { margin: 4px 0; }
    .msg.ai a { color: var(--achiote); text-decoration: none; font-weight: 600; }
    .msg.ai a:hover { text-decoration: underline; }

    .typing {
      display: inline-flex; gap: 4px; padding: 4px 0;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--saffron); opacity: 0.4;
      animation: blink 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.6; }
      .suggestion, .msg, .theme-btn { transition: none; }
    }

    /* Input bar */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: rgba(255, 247, 232, 0.85);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
      transition: background var(--transition-base), border-color var(--transition-base);
    }

    [data-theme="dark"] .input-bar {
      background: rgba(22, 16, 20, 0.85);
    }

    .input-wrap {
      max-width: 720px; margin: 0 auto;
      display: flex; gap: 10px; align-items: center;
    }
    .input-wrap input {
      flex: 1; padding: 14px 20px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--card-solid);
      font-size: 0.95rem; font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .input-wrap input::placeholder { color: var(--muted); opacity: 0.6; }
    .input-wrap input:focus {
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px rgba(242, 184, 75, 0.2);
    }
    .input-wrap input { touch-action: manipulation; }
    .input-wrap button {
      width: 48px; height: 48px; border-radius: 50%;
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--achiote), var(--achiote-2));
      color: #fff; font-size: 1.2rem;
      display: grid; place-items: center;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      flex-shrink: 0;
    }
    .input-wrap button:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(74, 22, 53, 0.25); }
    .input-wrap button:active { transform: scale(0.95); }
    .input-wrap button:disabled { opacity: 0.4; transform: none; box-shadow: none; cursor: default; }

    /* Demo auth */
    #demo-auth-wrap { margin-bottom: 8px; }
    #demo-auth-wrap summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    #demo-password {
      margin-top: 6px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 13px;
      width: 220px;
      background: var(--card-solid);
      color: var(--ink);
      font-family: inherit;
      outline: none;
    }
    #demo-password:focus { border-color: var(--saffron); }

    /* Responsive — tablet */
    @media (max-width: 980px) {
      .msg { max-width: 100%; }
      .input-wrap { max-width: 100%; }
    }

    /* Responsive — phone */
    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      header h1 span { display: none; }
      main { padding: 16px; }
      .input-bar { padding: 12px 16px; }
      .msg { padding: 16px 18px; max-width: 100%; }
      .welcome h2 { font-size: 1.35rem; }
      .welcome .suggestions { max-width: 100%; }
      .suggestion { font-size: 0.82rem; padding: 8px 14px; }
      .input-wrap input { font-size: 16px; padding: 12px 16px; }
      .input-wrap button { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" role="img" aria-label="Achiote logo"></div>
    <h1>Achiote <span>/ food memory detective</span></h1>
    <nav>
      <button class="theme-btn" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="moon">&#9789;</span>
        <span class="sun">&#9788;</span>
      </button>
      <a href="/about">About</a>
    </nav>
  </header>

  <main>
    <div class="welcome" id="welcome">
      <h2>What's the dish you can almost remember?</h2>
      <p>Describe a smell, a texture, a nickname, or the person who made it. Spelling does not matter — half memories are enough. Any sourcing help is static sourcing guidance, not live inventory.</p>
      <div class="suggestions">
        <button class="suggestion" data-suggestion="My abuela made pasteles with green bananas">My abuela made pasteles with green bananas</button>
        <button class="suggestion" data-suggestion="Sour soup with dill and pale white chunks">Sour soup with dill and pale white chunks</button>
        <button class="suggestion" data-suggestion="Sticky rice wrapped in a leaf, tasted like coconut">Sticky rice wrapped in a leaf, tasted like coconut</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </main>

  <div class="input-bar">
    <details id="demo-auth-wrap">
      <summary>Auth</summary>
      <input type="password" id="demo-password" placeholder="Demo password (optional)" />
      <input type="password" id="api-key" placeholder="API key (optional)" style="margin-top:6px;" />
    </details>
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Describe a food memory..." maxlength="600" autofocus />
      <button id="send-btn" aria-label="Send">&#8593;</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
